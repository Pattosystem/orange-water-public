
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オレンジ水道サービス｜水まわりのご相談</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans JP",sans-serif;background:#f1faff;color:#17364a}
header{background:white;padding:18px;text-align:center;border-bottom:4px solid #ff9638}
.logo{font-size:27px;font-weight:800;color:#ef8424}
main{max-width:850px;margin:auto;padding:22px 16px 70px}
h1{font-size:clamp(26px,5vw,39px);line-height:1.5;text-align:center}
.lead{text-align:center;font-size:18px;line-height:1.8}
.card{background:white;border-radius:20px;padding:22px;margin:20px 0;box-shadow:0 5px 18px #c6e0ee70}
h2{font-size:23px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.choice{background:#e9f7ff;border:2px solid #c8e8f8;border-radius:16px;padding:22px 10px;font-size:19px;font-weight:700;cursor:pointer;min-height:125px}
.choice span{display:block;font-size:42px;margin-bottom:8px}
.choice:focus,.choice:hover{border-color:#ff9638;background:#fff5e9}
.primary{display:block;width:100%;background:#f58a25;color:#152c3a;border:0;border-radius:15px;padding:19px;font-size:20px;font-weight:800;cursor:pointer}
.note{color:#536c7b;line-height:1.7}
#result{display:none}
@media(max-width:480px){.choice{font-size:17px;padding:17px 5px;min-height:115px}}
</style>
</head>
<body>
<header><div class="logo">💧 オレンジ水道サービス</div></header>
<main>
<h1>水まわりのお困りごと、<br>一緒に解決しましょう。</h1>
<p class="lead">難しい説明は必要ありません。<br>今の状況に近いものを選んでください。</p>

<section class="card">
<h2>どのようなご相談ですか？</h2>
<div class="grid">
<button class="choice" onclick="choose('水漏れ')"><span>💦</span>水が漏れる</button>
<button class="choice" onclick="choose('詰まり')"><span>🚽</span>水が流れない</button>
<button class="choice" onclick="choose('蛇口交換')"><span>🚰</span>蛇口を交換したい</button>
<button class="choice" onclick="choose('その他')"><span>🛁</span>その他の水まわり</button>
</div>
</section>

<section class="card" id="result" aria-live="polite">
<h2 id="selected"></h2>
<p>写真を使ったAI相談機能を準備しています。</p>
<p class="note">このページは公開前の確認用です。現在、写真の送信や受付登録は行われません。</p>
<button class="primary" onclick="reset()">別の相談を選ぶ</button>
</section>
<p class="note">※水が大量に漏れている場合は、安全を確保し、可能であれば止水栓を閉めてください。電気設備が濡れている場合は触れないでください。</p>
</main>
<script>
function choose(value){
document.getElementById('selected').textContent='ご相談内容：'+value;
document.getElementById('result').style.display='block';
document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function reset(){
document.getElementById('result').style.display='none';
window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
